<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글로벌 반도체 칩 스펙 비교 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <header class="border-b border-slate-700 pb-4 flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-3xl font-bold text-sky-400">💻 반도체 스펙 분석 대시보드</h1>
                <p class="text-slate-400 text-sm mt-1">글로벌 최신 CPU, GPU, AP, AI 반도체 스펙 비교 시스템</p>
            </div>
            <div class="text-sm bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                등록된 칩: <span id="total-count" class="text-sky-400 font-bold">0</span>개
            </div>
        </header>

        <!-- 검색 및 필터 -->
        <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
            <input type="text" id="search-input" oninput="handleSearch()" placeholder="칩 이름, 제조사 검색 (예: Apple, M4, H100)..." 
                   class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500">
            
            <div class="flex flex-wrap gap-2 items-center">
                <span class="text-xs text-slate-400 mr-2">카테고리:</span>
                <button onclick="filterCategory('ALL')" class="category-btn px-3 py-1 rounded bg-sky-500 text-white text-xs font-medium">전체</button>
                <button onclick="filterCategory('CPU')" class="category-btn px-3 py-1 rounded bg-slate-700 text-slate-300 text-xs">CPU</button>
                <button onclick="filterCategory('GPU')" class="category-btn px-3 py-1 rounded bg-slate-700 text-slate-300 text-xs">GPU</button>
                <button onclick="filterCategory('AP')" class="category-btn px-3 py-1 rounded bg-slate-700 text-slate-300 text-xs">AP</button>
                <button onclick="filterCategory('AI')" class="category-btn px-3 py-1 rounded bg-slate-700 text-slate-300 text-xs">AI 가속기</button>
            </div>
        </section>

        <!-- 그래프 영역 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <h2 class="text-lg font-bold text-sky-300 mb-3">⚡ 트랜지스터 수 (억 개)</h2>
                <div id="transistor-bars" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <h2 class="text-lg font-bold text-rose-400 mb-3">🔥 소비 전력 (W)</h2>
                <div id="power-bars" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
            </div>
        </div>

        <!-- 테이블 -->
        <section class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700">
                <h2 class="text-base font-bold text-slate-200">📊 상세 스펙 데이터표</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-300 border-b border-slate-700">
                            <th class="p-3">칩 이름</th>
                            <th class="p-3">제조사</th>
                            <th class="p-3">분류</th>
                            <th class="p-3">공정</th>
                            <th class="p-3">트랜지스터</th>
                            <th class="p-3">소비전력</th>
                        </tr>
                    </thead>
                    <tbody id="chip-table-body"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        const chipsData = [
            { name: "Apple M4 Max", vendor: "Apple", type: "AP", nm: "3nm (TSMC)", transistors: 280, power: 62 },
            { name: "Apple M3 Max", vendor: "Apple", type: "AP", nm: "3nm (TSMC)", transistors: 920, power: 78 },
            { name: "Intel Core i9-14900K", vendor: "Intel", type: "CPU", nm: "10nm (Intel 7)", transistors: 250, power: 253 },
            { name: "AMD Ryzen 9 9950X", vendor: "AMD", type: "CPU", nm: "4nm (TSMC)", transistors: 178, power: 170 },
            { name: "NVIDIA RTX 4090", vendor: "NVIDIA", type: "GPU", nm: "4nm (TSMC 4N)", transistors: 763, power: 450 },
            { name: "NVIDIA H100", vendor: "NVIDIA", type: "AI", nm: "4nm (TSMC 4N)", transistors: 800, power: 700 },
            { name: "NVIDIA Blackwell B200", vendor: "NVIDIA", type: "AI", nm: "4nm (TSMC 4NP)", transistors: 2080, power: 1000 },
            { name: "AMD Instinct MI300X", vendor: "AMD", type: "AI", nm: "5nm/6nm (TSMC)", transistors: 1530, power: 750 },
            { name: "Snapdragon X Elite", vendor: "Qualcomm", type: "AP", nm: "4nm (TSMC)", transistors: 450, power: 45 },
            { name: "Exynos 2400", vendor: "Samsung", type: "AP", nm: "4nm (Samsung)", transistors: 110, power: 11 }
        ];

        let currentCategory = 'ALL';
        let searchQuery = '';

        function renderData() {
            const filtered = chipsData.filter(chip => {
                const matchCategory = (currentCategory === 'ALL' || chip.type === currentCategory);
                const matchSearch = searchQuery === '' || 
                    chip.name.toLowerCase().includes(searchQuery) || 
                    chip.vendor.toLowerCase().includes(searchQuery);
                return matchCategory && matchSearch;
            });

            document.getElementById('total-count').innerText = filtered.length;

            // 테이블
            document.getElementById('chip-table-body').innerHTML = filtered.map(chip => `
                <tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
                    <td class="p-3 font-semibold text-sky-400">${chip.name}</td>
                    <td class="p-3 text-slate-300">${chip.vendor}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded bg-slate-700 text-xs">${chip.type}</span></td>
                    <td class="p-3 text-slate-300">${chip.nm}</td>
                    <td class="p-3 text-emerald-400 font-semibold">${chip.transistors}억 개</td>
                    <td class="p-3 text-rose-400 font-semibold">${chip.power} W</td>
                </tr>
            `).join('');

            const maxT = Math.max(...chipsData.map(c => c.transistors));
            const maxP = Math.max(...chipsData.map(c => c.power));

            // 트랜지스터 그래프
            document.getElementById('transistor-bars').innerHTML = filtered.map(chip => `
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-slate-300">${chip.name}</span>
                        <span class="text-sky-400 font-bold">${chip.transistors}억 개</span>
                    </div>
                    <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-sky-400 h-full rounded-full" style="width: ${(chip.transistors / maxT) * 100}%"></div>
                    </div>
                </div>
            `).join('');

            // 전력 그래프
            document.getElementById('power-bars').innerHTML = filtered.map(chip => `
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-slate-300">${chip.name}</span>
                        <span class="text-rose-400 font-bold">${chip.power} W</span>
                    </div>
                    <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-rose-400 h-full rounded-full" style="width: ${(chip.power / maxP) * 100}%"></div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === 'ALL' && btn.innerText.includes('전체'))) {
                    btn.className = 'category-btn px-3 py-1 rounded bg-sky-500 text-white text-xs font-medium';
                } else {
                    btn.className = 'category-btn px-3 py-1 rounded bg-slate-700 text-slate-300 text-xs';
                }
            });
            renderData();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            renderData();
        }

        renderData();
    </script>
</body>
</html>
