<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글로벌 반도체 칩 스펙 비교 대시보드 Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- 헤더 및 컨트롤 바 -->
        <header class="border-b border-slate-700/60 pb-6 flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-sky-400 flex items-center gap-3">
                    <span>💻</span> 반도체 스펙 분석 대시보드 <span class="text-xs bg-sky-500/20 text-sky-400 border border-sky-500/30 px-2 py-0.5 rounded-full">Ultimate</span>
                </h1>
                <p class="text-slate-400 mt-2 text-sm md:text-base">글로벌 최신 CPU, GPU, AP, AI 반도체 스펙 비교 및 무어의 법칙 시각화 시스템</p>
            </div>
            
            <div class="flex items-center gap-3 flex-wrap">
                <button onclick="exportToCSV()" class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-700 transition text-sm flex items-center gap-1.5 shadow-sm">
                    📥 CSV 내보내기
                </button>
                <label class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-700 transition text-sm cursor-pointer flex items-center gap-1.5 shadow-sm">
                    📤 CSV 불러오기
                    <input type="file" id="csv-file-input" accept=".csv" onchange="importFromCSV(event)" class="hidden">
                </label>
                <button onclick="toggleDarkMode()" id="theme-btn" class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-700 transition text-sm font-medium shadow-sm">
                    <span id="theme-icon">🌙</span> <span id="theme-text">라이트모드</span>
                </button>
            </div>
        </header>

        <!-- 필터 & 검색 & 칩 등록 -->
        <section class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/70 shadow-lg space-y-4">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">🔍</span>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="칩 이름, 제조사, 파운드리 공정 검색 (예: Apple, 3nm, Blackwell)..." 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="toggleModal(true)" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl transition text-sm shadow-md whitespace-nowrap">
                        ➕ 신규 칩 추가
                    </button>
                    <button onclick="resetData()" class="px-3 py-2.5 bg-rose-900/40 border border-rose-700/50 hover:bg-rose-800/60 text-rose-300 rounded-xl transition text-xs whitespace-nowrap">
                        🔄 초기화
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-700/50 items-center">
                <span class="text-xs font-semibold text-slate-400 mr-2">카테고리:</span>
                <button onclick="filterCategory('ALL')" class="category-btn text-xs md:text-sm px-3.5 py-1.5 rounded-lg bg-sky-500 text-white font-medium transition">전체</button>
                <button onclick="filterCategory('CPU')" class="category-btn text-xs md:text-sm px-3.5 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition">CPU</button>
                <button onclick="filterCategory('GPU')" class="category-btn text-xs md:text-sm px-3.5 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition">GPU</button>
                <button onclick="filterCategory('AP')" class="category-btn text-xs md:text-sm px-3.5 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition">Mobile/PC AP</button>
                <button onclick="filterCategory('AI')" class="category-btn text-xs md:text-sm px-3.5 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition">AI 가속기</button>
                <span class="ml-auto text-xs text-slate-400">표시 중: <span id="total-count" class="text-sky-400 font-bold">0</span>개</span>
            </div>
        </section>

        <!-- 무어의 법칙 시각화 타임라인 -->
        <section class="bg-slate-800/80 p-5 rounded-2xl border border-indigo-500/30 shadow-lg">
            <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                <h2 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                    <span>📈</span> 연도별 트랜지스터 집적도 (무어의 법칙 타임라인)
                </h2>
                <span class="text-xs text-slate-400">출시 연도에 따른 트랜지스터 증가 추이</span>
            </div>
            <div id="moores-law-container" class="space-y-3 max-h-[300px] overflow-y-auto pr-2">
                <!-- JS 생성 -->
            </div>
        </section>

        <!-- 1대1 스펙 직접 비교 -->
        <section class="bg-slate-800/80 p-5 rounded-2xl border border-sky-500/30 shadow-lg">
            <h2 class="text-lg font-bold text-sky-400 mb-4 flex items-center gap-2">
                <span>⚖️</span> 1:1 스펙 정밀 비교
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">첫 번째 칩 (A)</label>
                    <select id="compare-select-1" onchange="updateComparison()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:border-sky-500"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">두 번째 칩 (B)</label>
                    <select id="compare-select-2" onchange="updateComparison()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:border-sky-500"></select>
                </div>
            </div>

            <div id="compare-result" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900/60 p-4 rounded-xl border border-slate-700/50"></div>
        </section>

        <!-- 동적 바 그래프 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700/70 shadow-lg">
                <h2 class="text-lg font-bold text-sky-300 mb-4 flex items-center gap-2">
                    <span>⚡</span> 트랜지스터 수 (억 개)
                </h2>
                <div id="transistor-bars" class="space-y-3.5 max-h-[480px] overflow-y-auto pr-2"></div>
            </div>
            <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700/70 shadow-lg">
                <h2 class="text-lg font-bold text-rose-400 mb-4 flex items-center gap-2">
                    <span>🔥</span> 소비 전력 (W)
                </h2>
                <div id="power-bars" class="space-y-3.5 max-h-[480px] overflow-y-auto pr-2"></div>
            </div>
        </div>

        <!-- 스펙 데이터 테이블 -->
        <section class="bg-slate-800/80 rounded-2xl border border-slate-700/70 overflow-hidden shadow-lg">
            <div class="p-4 border-b border-slate-700/70">
                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                    <span>📊</span> 반도체 스펙 데이터베이스
                </h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-700/40 text-slate-300 text-xs md:text-sm border-b border-slate-700">
                            <th class="p-3.5">칩 제품명</th>
                            <th class="p-3.5">제조사</th>
                            <th class="p-3.5">출시년도</th>
                            <th class="p-3.5">분류</th>
                            <th class="p-3.5">공정 (파운드리)</th>
                            <th class="p-3.5">트랜지스터</th>
                            <th class="p-3.5">소비전력</th>
                            <th class="p-3.5 text-center">관리</th>
                        </tr>
                    </thead>
                    <tbody id="chip-table-body" class="text-sm"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- 신규 칩 추가 모달 -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-sky-400">➕ 커스텀 반도체 칩 등록</h3>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white text-xl">✕</button>
            </div>
            <form id="add-chip-form" onsubmit="handleAddChip(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">칩 제품명 *</label>
                    <input type="text" id="input-name" required placeholder="예: Apple M4 Pro" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">제조사 *</label>
                        <input type="text" id="input-vendor" required placeholder="예: Apple" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">출시년도 *</label>
                        <input type="number" id="input-year" required min="1970" max="2030" value="2025" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">분류 *</label>
                        <select id="input-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                            <option value="CPU">CPU</option>
                            <option value="GPU">GPU</option>
                            <option value="AP">AP</option>
                            <option value="AI">AI 가속기</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">제조 공정 *</label>
                    <input type="text" id="input-nm" required placeholder="예: 3nm (TSMC)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">트랜지스터(억 개) *</label>
                        <input type="number" id="input-transistors" required min="1" placeholder="예: 400" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">소비전력(W) *</label>
                        <input type="number" id="input-power" required min="1" placeholder="예: 45" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                    </div>
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="toggleModal(false)" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition">취소</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-medium transition">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 초기 기본 20종 데이터베이스
        const defaultChips = [
            { name: "Apple M4 Max", vendor: "Apple", year: 2024, type: "AP", nm: "3nm (TSMC)", transistors: 280, power: 62 },
            { name: "Apple M3 Max", vendor: "Apple", year: 2023, type: "AP", nm: "3nm (TSMC)", transistors: 920, power: 78 },
            { name: "Apple M2 Ultra", vendor: "Apple", year: 2023, type: "AP", nm: "5nm (TSMC)", transistors: 1340, power: 100 },
            { name: "Intel Core i9-14900K", vendor: "Intel", year: 2023, type: "CPU", nm: "10nm (Intel 7)", transistors: 250, power: 253 },
            { name: "Intel Core Ultra 7 155H", vendor: "Intel", year: 2023, type: "CPU", nm: "4nm (Intel 4)", transistors: 200, power: 45 },
            { name: "Intel Panther Lake", vendor: "Intel", year: 2025, type: "CPU", nm: "1.8nm (Intel 18A)", transistors: 350, power: 30 },
            { name: "AMD Ryzen 9 9950X", vendor: "AMD", year: 2024, type: "CPU", nm: "4nm (TSMC)", transistors: 178, power: 170 },
            { name: "AMD EPYC 9654 (서버용)", vendor: "AMD", year: 2022, type: "CPU", nm: "5nm (TSMC)", transistors: 900, power: 360 },
            { name: "NVIDIA RTX 4090", vendor: "NVIDIA", year: 2022, type: "GPU", nm: "4nm (TSMC 4N)", transistors: 763, power: 450 },
            { name: "NVIDIA H100 (AI 가속기)", vendor: "NVIDIA", year: 2022, type: "AI", nm: "4nm (TSMC 4N)", transistors: 800, power: 700 },
            { name: "NVIDIA Blackwell B200", vendor: "NVIDIA", year: 2024, type: "AI", nm: "4nm (TSMC 4NP)", transistors: 2080, power: 1000 },
            { name: "NVIDIA Rubin B300", vendor: "NVIDIA", year: 2026, type: "AI", nm: "3nm (TSMC)", transistors: 3360, power: 1100 },
            { name: "AMD Instinct MI300X", vendor: "AMD", year: 2023, type: "AI", nm: "5nm/6nm (TSMC)", transistors: 1530, power: 750 },
            { name: "Snapdragon 8 Gen 3", vendor: "Qualcomm", year: 2023, type: "AP", nm: "4nm (TSMC)", transistors: 100, power: 10 },
            { name: "Snapdragon X Elite", vendor: "Qualcomm", year: 2024, type: "AP", nm: "4nm (TSMC)", transistors: 450, power: 45 },
            { name: "Exynos 2400", vendor: "Samsung", year: 2024, type: "AP", nm: "4nm (Samsung LPP+)", transistors: 110, power: 11 },
            { name: "Google Tensor G3", vendor: "Google", year: 2023, type: "AP", nm: "4nm (Samsung)", transistors: 95, power: 9 },
            { name: "Apple A17 Pro", vendor: "Apple", year: 2023, type: "AP", nm: "3nm (TSMC)", transistors: 190, power: 8 },
            { name: "Intel Core i9-12900K", vendor: "Intel", year: 2021, type: "CPU", nm: "10nm (Intel 7)", transistors: 140, power: 241 },
            { name: "Apple M1 Ultra", vendor: "Apple", year: 2022, type: "AP", nm: "5nm (TSMC)", transistors: 1140, power: 60 }
        ];

        let chipsData = [];
        let currentCategory = 'ALL';
        let searchQuery = '';
        let isDarkMode = true;

        // LocalStorage 데이터 로드
        function loadData() {
            const saved = localStorage.getItem('semiconductor_chips_v2');
            chipsData = saved ? JSON.parse(saved) : [...defaultChips];
        }

        // LocalStorage 저장
        function saveData() {
            localStorage.setItem('semiconductor_chips_v2', JSON.stringify(chipsData));
        }

        // 초기화
        function resetData() {
            if (confirm("모든 데이터를 기본 20종 스펙으로 초기화하시겠습니까?")) {
                chipsData = [...defaultChips];
                saveData();
                renderData();
            }
        }

        function renderData() {
            const filtered = chipsData.filter(chip => {
                const matchCategory = (currentCategory === 'ALL' || chip.type === currentCategory);
                const matchSearch = searchQuery === '' || 
                    chip.name.toLowerCase().includes(searchQuery) || 
                    chip.vendor.toLowerCase().includes(searchQuery) ||
                    chip.nm.toLowerCase().includes(searchQuery);
                return matchCategory && matchSearch;
            });

            document.getElementById('total-count').innerText = filtered.length;

            // 1. 테이블
            const tbody = document.getElementById('chip-table-body');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-500">검색 조건에 맞는 데이터가 없습니다.</td></tr>`;
            } else {
                tbody.innerHTML = filtered.map((chip, index) => `
                    <tr class="border-b border-slate-700/40 hover:bg-slate-700/30 transition">
                        <td class="p-3.5 font-semibold text-sky-400">${chip.name}</td>
                        <td class="p-3.5 text-slate-300">${chip.vendor}</td>
                        <td class="p-3.5 text-slate-400">${chip.year || '2024'}</td>
                        <td class="p-3.5"><span class="px-2 py-0.5 rounded bg-slate-700 text-xs text-slate-300">${chip.type}</span></td>
                        <td class="p-3.5 text-slate-400">${chip.nm}</td>
                        <td class="p-3.5 text-emerald-400 font-semibold">${chip.transistors.toLocaleString()}억 개</td>
                        <td class="p-3.5 text-rose-400 font-semibold">${chip.power} W</td>
                        <td class="p-3.5 text-center">
                            <button onclick="deleteChip(${index})" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1 rounded bg-rose-500/10 hover:bg-rose-500/20 transition">삭제</button>
                        </td>
                    </tr>
                `).join('');
            }

            // 기준 최대값
            const maxTransistors = Math.max(...chipsData.map(c => c.transistors), 100);
            const maxPower = Math.max(...chipsData.map(c => c.power), 100);

            // 2. 바 그래프
            document.getElementById('transistor-bars').innerHTML = filtered.map(chip => `
                <div>
                    <div class="flex justify-between text-xs md:text-sm mb-1">
                        <span class="text-slate-300 font-medium">${chip.name} <span class="text-xs text-slate-500">(${chip.vendor})</span></span>
                        <span class="text-sky-400 font-bold">${chip.transistors.toLocaleString()}억 개</span>
                    </div>
                    <div class="w-full bg-slate-700/60 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-gradient-to-r from-sky-500 to-cyan-400 h-full rounded-full transition-all duration-500" style="width: ${(chip.transistors / maxTransistors) * 100}%"></div>
                    </div>
                </div>
            `).join('');

            document.getElementById('power-bars').innerHTML = filtered.map(chip => `
                <div>
                    <div class="flex justify-between text-xs md:text-sm mb-1">
                        <span class="text-slate-300 font-medium">${chip.name} <span class="text-xs text-slate-500">(${chip.vendor})</span></span>
                        <span class="text-rose-400 font-bold">${chip.power} W</span>
                    </div>
                    <div class="w-full bg-slate-700/60 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-gradient-to-r from-rose-500 to-amber-500 h-full rounded-full transition-all duration-500" style="width: ${(chip.power / maxPower) * 100}%"></div>
                    </div>
                </div>
            `).join('');

            // 3. 무어의 법칙 타임라인
            const sortedByYear = [...filtered].sort((a, b) => (a.year || 2024) - (b.year || 2024));
            document.getElementById('moores-law-container').innerHTML = sortedByYear.map(chip => `
                <div class="flex items-center gap-3 text-xs md:text-sm p-2 rounded-lg bg-slate-900/50 border border-slate-700/40">
                    <span class="font-bold text-indigo-400 bg-indigo-500/20 px-2 py-1 rounded w-16 text-center">${chip.year || '2024'}</span>
                    <span class="font-medium text-slate-200 flex-1">${chip.name} <span class="text-slate-500 text-xs">(${chip.vendor})</span></span>
                    <span class="text-emerald-400 font-semibold">${chip.transistors.toLocaleString()}억 개</span>
                </div>
            `).join('');

            populateCompareSelects();
        }

        function deleteChip(index) {
            if (confirm("이 칩 스펙을 목록에서 삭제하시겠습니까?")) {
                chipsData.splice(index, 1);
                saveData();
                renderData();
            }
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText.includes(category) || (category === 'ALL' && btn.innerText.includes('전체'))) {
                    btn.className = 'category-btn text-xs md:text-sm px-3.5 py-1.5 rounded-lg bg-sky-500 text-white font-medium transition';
                } else {
                    btn.className = 'category-btn text-xs md:text-sm px-3.5 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition';
                }
            });
            renderData();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            renderData();
        }

        function populateCompareSelects() {
            const select1 = document.getElementById('compare-select-1');
            const select2 = document.getElementById('compare-select-2');
            const v1 = select1.value, v2 = select2.value;

            const options = chipsData.map((chip, idx) => `<option value="${idx}">${chip.name} (${chip.vendor})</option>`).join('');
            select1.innerHTML = options;
            select2.innerHTML = options;

            select1.value = (v1 !== "" && v1 < chipsData.length) ? v1 : 0;
            select2.value = (v2 !== "" && v2 < chipsData.length) ? v2 : (chipsData.length > 10 ? 10 : 1);

            updateComparison();
        }

        function updateComparison() {
            const cA = chipsData[document.getElementById('compare-select-1').value];
            const cB = chipsData[document.getElementById('compare-select-2').value];
            if (!cA || !cB) return;
